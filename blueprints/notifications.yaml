mode: restart
blueprint:
  name: 🔔 Notifications (Version 2.2.0 - Fields)
  description: >-
    Actionable mobile notification script for Home Assistant Companion.
    All configurable values are exposed as script fields and copied into runtime
    variables. Response callbacks use selectable script entities so field-provided
    callbacks can be executed without templating a dynamic choose.sequence.
  domain: script
  source_url: https://github.com/chriscolden/homeassistant/blob/main/blueprints/notifications.yaml
  author: chriscolden/homeassistant
  homeassistant:
    min_version: 2024.6.0

  input:
    notify_device:
      name: "📲 Device to notify"
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app

    title:
      name: "🏷️ Title"
      default: ""
      selector:
        text:
    subtitle:
      name: "🏷️ Subtitle"
      default: ""
      selector:
        text:
    message:
      name: "💬 Message"
      default: ""
      selector:
        text:
    icon:
      name: "🙂 Icon"
      default: ""
      selector:
        icon:
    enable_icon_color:
      name: "🎨 Use Icon Color"
      default: false
      selector:
        boolean:
    icon_color:
      name: "🎨 Icon Color"
      default: [102, 186, 240]
      selector:
        color_rgb:

    option_one:
      name: "1️⃣ Option 1"
      icon: mdi:numeric-1-circle
      description: Configure the first notification action.
      collapsed: true
      input:
        confirm_enabled:
          name: "1️⃣ Option 1"
          default: false
          selector:
            boolean:
        confirm_text:
          name: "1️⃣ Option 1 - Title"
          default: "Option 1"
          selector:
            text:
        confirm_option_mode:
          name: "1️⃣ Option 1 - Mode"
          default: ""
          selector:
            select:
              mode: dropdown
              options:
                - label: ""
                  value: ""
                - label: Action(s)
                  value: action
                - label: "Link (🤖 Android Only)"
                  value: uri
        confirm_action_script:
          name: "1️⃣ Option 1 - Callback Script"
          default: ""
          selector:
            entity:
              filter:
                - domain: script
        confirm_uri:
          name: "1️⃣ Option 1 - Link"
          default: ""
          selector:
            text:
              type: url
        confirm_icon:
          name: "1️⃣ Option 1 - Icon"
          default: ""
          selector:
            text:
              prefix: "sfsymbols:"
        confirm_is_destructive:
          name: "1️⃣ Option 1 - Destructive"
          default: false
          selector:
            boolean:
        confirm_authentication_required:
          name: "1️⃣ Option 1 - Authentication Required"
          default: false
          selector:
            boolean:

    option_two:
      name: "2️⃣ Option 2"
      icon: mdi:numeric-2-circle
      description: Configure the second notification action.
      collapsed: true
      input:
        dismiss_enabled:
          name: "2️⃣ Option 2"
          default: false
          selector:
            boolean:
        dismiss_text:
          name: "2️⃣ Option 2 - Title"
          default: "Option 2"
          selector:
            text:
        dismiss_option_mode:
          name: "2️⃣ Option 2 - Mode"
          default: ""
          selector:
            select:
              mode: dropdown
              options:
                - label: ""
                  value: ""
                - label: Action(s)
                  value: action
                - label: "Link (🤖 Android Only)"
                  value: uri
        dismiss_action_script:
          name: "2️⃣ Option 2 - Callback Script"
          default: ""
          selector:
            entity:
              filter:
                - domain: script
        dismiss_uri:
          name: "2️⃣ Option 2 - Link"
          default: ""
          selector:
            text:
              type: url
        dismiss_icon:
          name: "2️⃣ Option 2 - Icon"
          default: ""
          selector:
            text:
              prefix: "sfsymbols:"
        dismiss_is_destructive:
          name: "2️⃣ Option 2 - Destructive"
          default: false
          selector:
            boolean:
        dismiss_authentication_required:
          name: "2️⃣ Option 2 - Authentication Required"
          default: false
          selector:
            boolean:

    option_three:
      name: "3️⃣ Option 3"
      icon: mdi:numeric-3-circle
      description: Configure the third notification action.
      collapsed: true
      input:
        option_three_enabled:
          name: "3️⃣ Option 3"
          default: false
          selector:
            boolean:
        option_three_text:
          name: "3️⃣ Option 3 - Title"
          default: "Option 3"
          selector:
            text:
        option_three_option_mode:
          name: "3️⃣ Option 3 - Mode"
          default: ""
          selector:
            select:
              mode: dropdown
              options:
                - label: ""
                  value: ""
                - label: Action(s)
                  value: action
                - label: "Link (🤖 Android Only)"
                  value: uri
        option_three_action_script:
          name: "3️⃣ Option 3 - Callback Script"
          default: ""
          selector:
            entity:
              filter:
                - domain: script
        option_three_uri:
          name: "3️⃣ Option 3 - Link"
          default: ""
          selector:
            text:
              type: url
        option_three_icon:
          name: "3️⃣ Option 3 - Icon"
          default: ""
          selector:
            text:
              prefix: "sfsymbols:"
        option_three_is_destructive:
          name: "3️⃣ Option 3 - Destructive"
          default: false
          selector:
            boolean:
        option_three_authentication_required:
          name: "3️⃣ Option 3 - Authentication Required"
          default: false
          selector:
            boolean:

    enable_timeout:
      name: "⌛️ Enable Timeout"
      default: false
      selector:
        boolean:
    timeout:
      name: "⌛️ Timeout Duration"
      default:
        hours: 0
        minutes: 15
        seconds: 0
      selector:
        duration:
          enable_day: false
    run_timeout_actions:
      name: "⌛️ Enable Timeout Action(s)"
      default: false
      selector:
        boolean:
    timeout_action_script:
      name: "⌛️ Timeout Callback Script"
      default: ""
      selector:
        entity:
          filter:
            - domain: script
    swipe_away_as_timeout:
      name: "⌛️ Run timeout action(s) when notification cleared"
      default: false
      selector:
        boolean:
    clear_on_timeout:
      name: "🧹 Clear notification on timeout"
      default: false
      selector:
        boolean:
    persist:
      name: "🚩 Persistent Notification"
      default: false
      selector:
        boolean:

    notification_link:
      name: "🔗 Notification Link"
      default: ""
      selector:
        text:
    attachment_type:
      name: "📸 Attachment Type"
      default: "none"
      selector:
        select:
          options:
            - label: None
              value: none
            - label: Camera
              value: camera_entity
    attachment_camera_entity:
      name: "📸 Attachment: Camera Entity"
      default: ""
      selector:
        entity:
          filter:
            - domain: camera
    car_ui:
      name: "🚘 Show on Android Auto"
      default: false
      selector:
        boolean:
    tag:
      name: "🔖 Tag"
      default: ""
      selector:
        text:
    group:
      name: "📣 Notification Group ID"
      default: ""
      selector:
        text:
    channel:
      name: "📣 Notification Channel"
      default: General
      selector:
        text:
    importance:
      name: "❕ Notification Channel Importance"
      default: default
      selector:
        select:
          options:
            - label: Urgent
              value: high
            - label: Default
              value: default
            - label: Silent
              value: low
            - label: Low
              value: min
    android_high_priority:
      name: "❕ High Priority Mode"
      default: false
      selector:
        boolean:
    interruption_level:
      name: "❕ Interruption Level"
      default: active
      selector:
        select:
          options:
            - label: Silent
              value: passive
            - label: Default
              value: active
            - label: Important
              value: time-sensitive
            - label: Critical
              value: critical
    visibility:
      name: "🔏 Notification Lockscreen Visibility"
      default: private
      selector:
        select:
          options:
            - label: Public
              value: public
            - label: Private
              value: private
            - label: Secret
              value: secret

fields:
  field_notify_device:
    name: "📲 Device to notify"
    description: "Device needs to run the official Home Assistant Companion app to receive notifications."
    required: false
    default: !input notify_device
    selector:
      device:
        filter:
          - integration: mobile_app
  field_title:
    name: "🏷️ Title"
    description: "The title of the notification. Optional."
    required: false
    default: !input title
    selector:
      text:
  field_subtitle:
    name: "🏷️ Subtitle"
    description: "The subtitle of the notification. Optional."
    required: false
    default: !input subtitle
    selector:
      text:
  field_message:
    name: "💬 Message"
    description: "The message body to display on the notification. Android supports HTML formatting."
    required: false
    default: !input message
    selector:
      text:
  field_icon:
    name: "🙂 Icon"
    description: "Custom icon for this notification. Android only, optional."
    required: false
    default: !input icon
    selector:
      icon:
  field_enable_icon_color:
    name: "🎨 Use Icon Color"
    description: "If disabled, uses the default icon color. Android only, optional."
    required: false
    default: false
    selector:
      boolean:
  field_icon_color:
    name: "🎨 Icon Color"
    description: "Custom icon color for this notification. Android only, optional."
    required: false
    default: !input icon_color
    selector:
      color_rgb:

  field_option_one_enabled:
    name: "1️⃣ Option 1 - Enabled"
    description: "Show or hide this option."
    required: false
    default: false
    selector:
      boolean:
  field_option_one_title:
    name: "1️⃣ Option 1 - Title"
    description: "Title to show on the first option."
    required: false
    default: !input confirm_text
    selector:
      text:
  field_option_one_mode:
    name: "1️⃣ Option 1 - Mode"
    description: "Action mode for this option. Android can use either a Home Assistant action or a link; iOS can use both. Optional."
    required: false
    default: !input confirm_option_mode
    selector:
      select:
        mode: dropdown
        options:
          - label: ""
            value: ""
          - label: Action(s)
            value: action
          - label: "Link (🤖 Android Only)"
            value: uri
  field_option_one_script:
    name: "1️⃣ Option 1 - Callback Script"
    description: "Script to run when Option 1 is selected. The script receives the notification response as `notification_response`. Optional."
    required: false
    default: !input confirm_action_script
    selector:
      entity:
        filter:
          - domain: script
  field_option_one_uri:
    name: "1️⃣ Option 1 - Link"
    description: "Navigate to a link or app when this option is selected. Android: used with Mode: Link. iOS: leave empty to disable. Optional."
    required: false
    default: !input confirm_uri
    selector:
      text:
        type: url
  field_option_one_icon:
    name: "1️⃣ Option 1 - Icon"
    description: "Custom icon to show on this option. iOS only, optional."
    required: false
    default: !input confirm_icon
    selector:
      text:
        prefix: "sfsymbols:"
  field_option_one_destructive:
    name: "1️⃣ Option 1 - Destructive"
    description: "Set the action's title to be red, indicating a destructive action. iOS only, optional."
    required: false
    default: false
    selector:
      boolean:
  field_option_one_authentication_required:
    name: "1️⃣ Option 1 - Authentication Required"
    description: "Require the device to be unlocked to use this option. iOS only, optional."
    required: false
    default: false
    selector:
      boolean:

  field_option_two_enabled:
    name: "2️⃣ Option 2 - Enabled"
    description: "Show or hide this option."
    required: false
    default: false
    selector:
      boolean:
  field_option_two_title:
    name: "2️⃣ Option 2 - Title"
    description: "Title to show on the second option."
    required: false
    default: !input dismiss_text
    selector:
      text:
  field_option_two_mode:
    name: "2️⃣ Option 2 - Mode"
    description: "Action mode for this option. Android can use either a Home Assistant action or a link; iOS can use both. Optional."
    required: false
    default: !input dismiss_option_mode
    selector:
      select:
        mode: dropdown
        options:
          - label: ""
            value: ""
          - label: Action(s)
            value: action
          - label: "Link (🤖 Android Only)"
            value: uri
  field_option_two_script:
    name: "2️⃣ Option 2 - Callback Script"
    description: "Script to run when Option 2 is selected. The script receives the notification response as `notification_response`. Optional."
    required: false
    default: !input dismiss_action_script
    selector:
      entity:
        filter:
          - domain: script
  field_option_two_uri:
    name: "2️⃣ Option 2 - Link"
    description: "Navigate to a link or app when this option is selected. Android: used with Mode: Link. iOS: leave empty to disable. Optional."
    required: false
    default: !input dismiss_uri
    selector:
      text:
        type: url
  field_option_two_icon:
    name: "2️⃣ Option 2 - Icon"
    description: "Custom icon to show on this option. iOS only, optional."
    required: false
    default: !input dismiss_icon
    selector:
      text:
        prefix: "sfsymbols:"
  field_option_two_destructive:
    name: "2️⃣ Option 2 - Destructive"
    description: "Set the action's title to be red, indicating a destructive action. iOS only, optional."
    required: false
    default: false
    selector:
      boolean:
  field_option_two_authentication_required:
    name: "2️⃣ Option 2 - Authentication Required"
    description: "Require the device to be unlocked to use this option. iOS only, optional."
    required: false
    default: false
    selector:
      boolean:

  field_option_three_enabled:
    name: "3️⃣ Option 3 - Enabled"
    description: "Show or hide this option."
    required: false
    default: false
    selector:
      boolean:
  field_option_three_title:
    name: "3️⃣ Option 3 - Title"
    description: "Title to show on the third option."
    required: false
    default: !input option_three_text
    selector:
      text:
  field_option_three_mode:
    name: "3️⃣ Option 3 - Mode"
    description: "Action mode for this option. Android can use either a Home Assistant action or a link; iOS can use both. Optional."
    required: false
    default: !input option_three_option_mode
    selector:
      select:
        mode: dropdown
        options:
          - label: ""
            value: ""
          - label: Action(s)
            value: action
          - label: "Link (🤖 Android Only)"
            value: uri
  field_option_three_script:
    name: "3️⃣ Option 3 - Callback Script"
    description: "Script to run when Option 3 is selected. The script receives the notification response as `notification_response`. Optional."
    required: false
    default: !input option_three_action_script
    selector:
      entity:
        filter:
          - domain: script
  field_option_three_uri:
    name: "3️⃣ Option 3 - Link"
    description: "Navigate to a link or app when this option is selected. Android: used with Mode: Link. iOS: leave empty to disable. Optional."
    required: false
    default: !input option_three_uri
    selector:
      text:
        type: url
  field_option_three_icon:
    name: "3️⃣ Option 3 - Icon"
    description: "Custom icon to show on this option. iOS only, optional."
    required: false
    default: !input option_three_icon
    selector:
      text:
        prefix: "sfsymbols:"
  field_option_three_destructive:
    name: "3️⃣ Option 3 - Destructive"
    description: "Set the action's title to be red, indicating a destructive action. iOS only, optional."
    required: false
    default: false
    selector:
      boolean:
  field_option_three_authentication_required:
    name: "3️⃣ Option 3 - Authentication Required"
    description: "Require the device to be unlocked to use this option. iOS only, optional."
    required: false
    default: false
    selector:
      boolean:

  field_enable_timeout:
    name: "⌛️ Enable Timeout"
    description: "Require the script to stop listening after the set duration. If disabled, the script waits for a response indefinitely until triggered again."
    required: false
    default: false
    selector:
      boolean:
  field_timeout:
    name: "⌛️ Timeout Duration"
    description: "Amount of time to wait for an action response before firing the timeout callback. Default: 15 minutes."
    required: false
    default: !input timeout
    selector:
      duration:
        enable_day: false
  field_run_timeout_actions:
    name: "⌛️ Enable Timeout Action(s)"
    description: "Run the timeout callback when a timeout event occurs. If disabled, the script times out without executing the callback."
    required: false
    default: false
    selector:
      boolean:
  field_timeout_script:
    name: "⌛️ Timeout Callback Script"
    description: "Script to run when the notification response times out or the notification is cleared as a timeout. The script receives the notification response as `notification_response`. Optional."
    required: false
    default: !input timeout_action_script
    selector:
      entity:
        filter:
          - domain: script
  field_swipe_away_as_timeout:
    name: "⌛️ Run timeout action(s) when notification cleared"
    description: "If enabled, swiping the notification away immediately triggers the timeout callback. Android only."
    required: false
    default: false
    selector:
      boolean:
  field_clear_on_timeout:
    name: "🧹 Clear notification on timeout"
    description: "Dismiss the notification after the action response times out."
    required: false
    default: false
    selector:
      boolean:
  field_persist:
    name: "🚩 Persistent Notification"
    description: "Prevents notifications from being swiped away accidentally. Android only. This blocks using notification clearing as a timeout trigger."
    required: false
    default: false
    selector:
      boolean:

  field_notification_link:
    name: "🔗 Notification Link"
    description: "Custom link to open when the notification is selected. Optional."
    required: false
    default: !input notification_link
    selector:
      text:
  field_attachment_type:
    name: "📸 Attachment Type"
    description: "Select whether to attach no media or a camera snapshot."
    required: false
    default: !input attachment_type
    selector:
      select:
        options:
          - label: None
            value: none
          - label: Camera
            value: camera_entity
  field_attachment_camera_entity:
    name: "📸 Attachment: Camera Entity"
    description: "Camera entity to use for the notification attachment. Used when Attachment Type is Camera. Optional."
    required: false
    default: !input attachment_camera_entity
    selector:
      entity:
        filter:
          - domain: camera
  field_car_ui:
    name: "🚘 Show on Android Auto"
    description: "Show the notification on Android Auto. Android only."
    required: false
    default: false
    selector:
      boolean:
  field_tag:
    name: "🔖 Tag"
    description: "Notification tag used to identify and clear this notification. Optional."
    required: false
    default: !input tag
    selector:
      text:
  field_group:
    name: "📣 Notification Group ID"
    description: "Notification group ID used to group related notifications. Optional."
    required: false
    default: !input group
    selector:
      text:
  field_channel:
    name: "📣 Notification Channel"
    description: "Android notification channel name."
    required: false
    default: !input channel
    selector:
      text:
  field_importance:
    name: "❕ Notification Channel Importance"
    description: "Android notification channel importance."
    required: false
    default: !input importance
    selector:
      select:
        options:
          - label: Urgent
            value: high
          - label: Default
            value: default
          - label: Silent
            value: low
          - label: Low
            value: min
  field_android_high_priority:
    name: "❕ High Priority Mode"
    description: "Use high-priority Android notification delivery."
    required: false
    default: false
    selector:
      boolean:
  field_interruption_level:
    name: "❕ Interruption Level"
    description: "iOS notification interruption level."
    required: false
    default: !input interruption_level
    selector:
      select:
        options:
          - label: Silent
            value: passive
          - label: Default
            value: active
          - label: Important
            value: time-sensitive
          - label: Critical
            value: critical
  field_visibility:
    name: "🔏 Notification Lockscreen Visibility"
    description: "Android lockscreen visibility for the notification."
    required: false
    default: !input visibility
    selector:
      select:
        options:
          - label: Public
            value: public
          - label: Private
            value: private
          - label: Secret
            value: secret

sequence:
  # --------------------------------------------------------------------------
  # Resolve every blueprint input through its corresponding script field.
  # --------------------------------------------------------------------------
  - alias: Resolve fields into variables
    variables:
      notify_device: "{{ field_notify_device }}"
      title: "{{ field_title }}"
      subtitle: "{{ field_subtitle }}"
      message: "{{ field_message }}"
      notification_icon: "{{ field_icon }}"
      enable_icon_color: "{{ field_enable_icon_color }}"
      icon_color: "{{ field_icon_color }}"
      icon_color_hex: >-
        {{ '#{:02x}{:02x}{:02x}'.format(
          icon_color[0], icon_color[1], icon_color[2]
        ) }}

      notification_link: "{{ field_notification_link }}"
      tag_input: "{{ field_tag }}"
      group: "{{ field_group }}"
      channel: "{{ field_channel }}"
      importance: "{{ field_importance }}"
      android_high_priority: "{{ field_android_high_priority }}"
      interruption_level: "{{ field_interruption_level }}"
      visibility: "{{ field_visibility }}"
      persist: "{{ field_persist }}"
      car_ui: "{{ field_car_ui }}"

      attachment_type: "{{ field_attachment_type }}"
      attachment_camera_entity: "{{ field_attachment_camera_entity }}"

      enable_timeout: "{{ field_enable_timeout }}"
      timeout: "{{ field_timeout }}"
      run_timeout_actions: "{{ field_run_timeout_actions }}"
      swipe_away_as_timeout: "{{ field_swipe_away_as_timeout }}"
      clear_on_timeout: "{{ field_clear_on_timeout }}"

      option_one_enabled: "{{ field_option_one_enabled }}"
      option_one_title: "{{ field_option_one_title }}"
      option_one_mode: "{{ field_option_one_mode }}"
      option_one_script: "{{ field_option_one_script }}"
      option_one_uri: "{{ field_option_one_uri }}"
      option_one_icon_value: "{{ field_option_one_icon }}"
      option_one_destructive: "{{ field_option_one_destructive }}"
      option_one_authentication_required: "{{ field_option_one_authentication_required }}"

      option_two_enabled: "{{ field_option_two_enabled }}"
      option_two_title: "{{ field_option_two_title }}"
      option_two_mode: "{{ field_option_two_mode }}"
      option_two_script: "{{ field_option_two_script }}"
      option_two_uri: "{{ field_option_two_uri }}"
      option_two_icon_value: "{{ field_option_two_icon }}"
      option_two_destructive: "{{ field_option_two_destructive }}"
      option_two_authentication_required: "{{ field_option_two_authentication_required }}"

      option_three_enabled: "{{ field_option_three_enabled }}"
      option_three_title: "{{ field_option_three_title }}"
      option_three_mode: "{{ field_option_three_mode }}"
      option_three_script: "{{ field_option_three_script }}"
      option_three_uri: "{{ field_option_three_uri }}"
      option_three_icon_value: "{{ field_option_three_icon }}"
      option_three_destructive: "{{ field_option_three_destructive }}"
      option_three_authentication_required: "{{ field_option_three_authentication_required }}"

      timeout_script: "{{ field_timeout_script }}"
      timeout_seconds: >-
        {{ as_timedelta(timeout).total_seconds() | int }}

  - alias: Build notification identifiers
    variables:
      first_option: "{{ 'FIRST_' ~ context.id }}"
      second_option: "{{ 'SECOND_' ~ context.id }}"
      third_option: "{{ 'THIRD_' ~ context.id }}"
      tag: >-
        {{ tag_input if tag_input | length else this.entity_id ~ '-' ~ context.id }}
      notify_service: >-
        {{ 'notify.mobile_app_' ~ device_attr(notify_device, 'name') | slugify }}

      option_one_action: "{{ 'URI' if option_one_mode == 'uri' else first_option }}"
      option_two_action: "{{ 'URI' if option_two_mode == 'uri' else second_option }}"
      option_three_action: "{{ 'URI' if option_three_mode == 'uri' else third_option }}"

      option_one_icon: >-
        {% if option_one_icon_value | length %}
          {{ option_one_icon_value if 'sfsymbols:' in option_one_icon_value else 'sfsymbols:' ~ option_one_icon_value }}
        {% endif %}
      option_two_icon: >-
        {% if option_two_icon_value | length %}
          {{ option_two_icon_value if 'sfsymbols:' in option_two_icon_value else 'sfsymbols:' ~ option_two_icon_value }}
        {% endif %}
      option_three_icon: >-
        {% if option_three_icon_value | length %}
          {{ option_three_icon_value if 'sfsymbols:' in option_three_icon_value else 'sfsymbols:' ~ option_three_icon_value }}
        {% endif %}

  - alias: Build notification options
    variables:
      option_one: >-
        {{ {
          'enabled': option_one_enabled,
          'action': option_one_action,
          'title': option_one_title,
          'icon': option_one_icon,
          'destructive': option_one_destructive,
          'authenticationRequired': option_one_authentication_required,
          'uri': option_one_uri
        } }}
      option_two: >-
        {{ {
          'enabled': option_two_enabled,
          'action': option_two_action,
          'title': option_two_title,
          'icon': option_two_icon,
          'destructive': option_two_destructive,
          'authenticationRequired': option_two_authentication_required,
          'uri': option_two_uri
        } }}
      option_three: >-
        {{ {
          'enabled': option_three_enabled,
          'action': option_three_action,
          'title': option_three_title,
          'icon': option_three_icon,
          'destructive': option_three_destructive,
          'authenticationRequired': option_three_authentication_required,
          'uri': option_three_uri
        } }}

  - alias: Build attachment URL
    variables:
      camera_image_url: >-
        {% if attachment_camera_entity | length %}
          {% if state_attr(attachment_camera_entity, 'entity_picture') | length %}
            {{ state_attr(attachment_camera_entity, 'entity_picture') }}
          {% else %}
            {{ '/api/camera_proxy/' ~ attachment_camera_entity }}
          {% endif %}
        {% endif %}
      media_url: >-
        {{ camera_image_url if attachment_type == 'camera_entity' else '' }}

  - alias: Build notification payload
    variables:
      notification_data: >-
        {% set apple = 'APPLE' in (device_attr(notify_device, 'manufacturer') | upper) %}
        {% set data = namespace(value={'apple_device': apple}) %}
        {% if apple %}
          {% set data.value = dict(data.value, **{'subtitle': subtitle}) %}
          {% set data.value = dict(data.value, **{'push': {'interruption-level': interruption_level}}) %}
          {% if notification_link | length %}
            {% set data.value = dict(data.value, **{'url': notification_link}) %}
          {% endif %}
          {% if attachment_type == 'camera_entity' %}
            {% set data.value = dict(data.value, **{'entity_id': attachment_camera_entity}) %}
          {% endif %}
        {% else %}
          {% set data.value = dict(data.value, **{'subject': subtitle}) %}
          {% set data.value = dict(data.value, **{'visibility': visibility}) %}
          {% set data.value = dict(data.value, **{'importance': 'high' if android_high_priority else importance}) %}
          {% set data.value = dict(data.value, **{'ttl': 0 if android_high_priority else none}) %}
          {% set data.value = dict(data.value, **{'sticky': persist}) %}
          {% set data.value = dict(data.value, **{'channel': channel}) %}
          {% set data.value = dict(data.value, **{'tag': tag}) %}
          {% set data.value = dict(data.value, **{'group': group}) %}
          {% set data.value = dict(data.value, **{'icon': notification_icon}) if notification_icon | length else data.value %}
          {% if enable_icon_color %}
            {% set data.value = dict(data.value, **{'color': icon_color_hex}) %}
          {% endif %}
          {% set data.value = dict(data.value, **{'notification_icon': notification_icon}) if notification_icon | length else data.value %}
          {% if notification_link | length %}
            {% set data.value = dict(data.value, **{'clickAction': notification_link}) %}
          {% endif %}
          {% if attachment_type == 'camera_entity' and media_url | length %}
            {% set data.value = dict(data.value, **{'image': media_url}) %}
          {% endif %}
          {% if car_ui %}
            {% set data.value = dict(data.value, **{'car_ui': true}) %}
          {% endif %}
        {% endif %}
        {% set actions = [] %}
        {% if option_one_enabled %}{% set actions = actions + [option_one] %}{% endif %}
        {% if option_two_enabled %}{% set actions = actions + [option_two] %}{% endif %}
        {% if option_three_enabled %}{% set actions = actions + [option_three] %}{% endif %}
        {{ dict(data.value, **{'actions': actions}) }}

  - alias: Send notification
    action: "{{ notify_service }}"
    data:
      title: "{{ title }}"
      message: "{{ message }}"
      data: "{{ notification_data }}"

  - alias: Determine whether a response is required
    variables:
      expect_response: >-
        {{ enable_timeout or option_one_enabled or option_two_enabled or option_three_enabled }}

  - alias: Initialize response trigger
    variables:
      wait_trigger: null

  - alias: Wait for response
    choose:
      - alias: Wait with timeout
        conditions:
          - condition: template
            value_template: "{{ expect_response and enable_timeout }}"
        sequence:
          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ first_option }}"
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ second_option }}"
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ third_option }}"
              - platform: event
                event_type: mobile_app_notification_cleared
                event_data:
                  tag: "{{ tag }}"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
          - variables:
              wait_trigger: "{{ wait.trigger }}"

      - alias: Wait indefinitely
        conditions:
          - condition: template
            value_template: "{{ expect_response and not enable_timeout }}"
        sequence:
          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ first_option }}"
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ second_option }}"
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ third_option }}"
              - platform: event
                event_type: mobile_app_notification_cleared
                event_data:
                  tag: "{{ tag }}"
          - variables:
              wait_trigger: "{{ wait.trigger }}"

  - alias: Parse response
    variables:
      user_response: >-
        {% set result = 'no_response' %}
        {% if expect_response %}
          {% if wait_trigger is none %}
            {% set result = 'timeout' %}
          {% elif wait_trigger.event.event_type == 'mobile_app_notification_cleared' and swipe_away_as_timeout %}
            {% set result = 'notification_cleared' %}
          {% elif wait_trigger.event.data.action == first_option %}
            {% set result = 'option_one' %}
          {% elif wait_trigger.event.data.action == second_option %}
            {% set result = 'option_two' %}
          {% elif wait_trigger.event.data.action == third_option %}
            {% set result = 'option_three' %}
          {% endif %}
        {% endif %}
        {{ {'result': result, 'trigger': wait_trigger} }}

  # --------------------------------------------------------------------------
  # Runtime callback execution.
  #
  # A script entity is used instead of a templated `choose.sequence` because
  # Home Assistant's Action selector returns an action list, while `sequence`
  # itself is not a runtime-templatable action-list slot. The selected script
  # can contain any normal Home Assistant actions.
  # --------------------------------------------------------------------------
  - alias: Run timeout callback
    choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ user_response.result in ['timeout', 'notification_cleared']
                 and run_timeout_actions
                 and timeout_script | length > 0 }}
        sequence:
          - action: "{{ timeout_script }}"
            data:
              notification_response: "{{ user_response }}"

  - alias: Run option 1 callback
    choose:
      - conditions:
          - condition: template
            value_template: "{{ user_response.result == 'option_one' and option_one_script | length > 0 }}"
        sequence:
          - action: "{{ option_one_script }}"
            data:
              notification_response: "{{ user_response }}"

  - alias: Run option 2 callback
    choose:
      - conditions:
          - condition: template
            value_template: "{{ user_response.result == 'option_two' and option_two_script | length > 0 }}"
        sequence:
          - action: "{{ option_two_script }}"
            data:
              notification_response: "{{ user_response }}"

  - alias: Run option 3 callback
    choose:
      - conditions:
          - condition: template
            value_template: "{{ user_response.result == 'option_three' and option_three_script | length > 0 }}"
        sequence:
          - action: "{{ option_three_script }}"
            data:
              notification_response: "{{ user_response }}"

  - alias: Clear notification after timeout
    if:
      - condition: template
        value_template: "{{ user_response.result == 'timeout' and clear_on_timeout }}"
    then:
      - action: "{{ notify_service }}"
        data:
          message: clear_notification
          data:
            tag: "{{ tag }}"

  - alias: Return user response
    stop: "Script stopped."
    response_variable: user_response
